name: CI/CD for riverpod_injected_generator

on:
  workflow_dispatch:
  push: &trigger
    branches:
      - "**"
    paths:
      - "packages/riverpod_injected_generator/**"
      - ".github/workflows/riverpod_injected_generator_ci.yaml"
      - ".github/workflows/riverpod_injected_generator_cd.yaml"
  pull_request: *trigger

jobs:
  ci:
    name: CI
    uses: Skycoder42/dart_test_tools/.github/workflows/dart.yml@main
    with:
      workingDirectory: packages/riverpod_injected_generator
      buildRunner: true
      unitTestPaths: -P unit
      integrationTestPaths: -P integration

  cd:
    name: CD
    uses: Skycoder42/dart_test_tools/.github/workflows/release.yml@main
    needs:
      - ci
    permissions:
      contents: write
      actions: write
    with:
      workingDirectory: packages/riverpod_injected_generator
      tagPrefix: riverpod_injected_generator-v
      publishWorkflow: riverpod_injected_generator_cd.yaml
