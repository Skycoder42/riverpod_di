name: riverpod_di_generator
description: A small code generator for simple dependency injection via riverpod
version: 1.0.0
repository: https://github.com/Skycoder42/riverpod_di

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  riverpod_di: ^1.0.0

dev_dependencies:
  dart_test_tools: ^7.3.0

cider:
  link_template:
    tag: https://github.com/Skycoder42/riverpod_di/releases/tag/riverpod_di_generator-v%tag%
    diff: https://github.com/Skycoder42/riverpod_di/compare/riverpod_di_generator-v%from%...riverpod_di_generator-v%to%
