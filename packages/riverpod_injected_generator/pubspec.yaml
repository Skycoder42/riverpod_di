name: riverpod_injected_generator
description: A small code generator for simple dependency injection via riverpod
version: 1.1.0
repository: https://github.com/Skycoder42/riverpod_injected

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  analyzer: ^13.3.0
  build: ^4.0.11
  build_config: ^1.3.3
  code_builder: ^4.12.0
  collection: ^1.19.1
  dart_test_tools: ^7.3.2
  meta: ^1.19.0
  riverpod_analyzer_utils: ^1.0.0-dev.11
  riverpod_injected: ^1.1.0
  source_gen: ^4.2.4
  source_helper: ^1.3.13

dev_dependencies:
  build_runner: ^2.16.1
  build_test: ^3.5.20
  logging: ^1.3.0
  riverpod: ^3.4.2
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8
  test: ^1.31.1

cider:
  link_template:
    tag: https://github.com/Skycoder42/riverpod_injected/releases/tag/riverpod_injected_generator-v%tag%
    diff: https://github.com/Skycoder42/riverpod_injected/compare/riverpod_injected_generator-v%from%...riverpod_injected_generator-v%to%
